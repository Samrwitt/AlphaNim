name: Deploy Nim to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - game_template.html
      - engine.js
      - app.js
      - build_site.py
      - data/self_play_games.json
      - artifacts/model.json
      - artifacts/alphazero_metrics.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare static game
        run: python3 build_site.py --output _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static game
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
